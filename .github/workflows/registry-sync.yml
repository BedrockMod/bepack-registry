name: registry-sync

on:
  repository_dispatch:
    types: [pack-released]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      repository_id:
        description: 'Registered numeric repository id (empty for all sources)'
        required: false
        type: string
      tag:
        description: 'Optional release tag hint'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: registry-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Mint registry Bot installation token
        id: bot
        env:
          REGISTRY_APP_ID: ${{ secrets.REGISTRY_APP_ID }}
          REGISTRY_APP_PRIVATE_KEY: ${{ secrets.REGISTRY_APP_PRIVATE_KEY }}
          REGISTRY_REPOSITORY: ${{ github.repository }}
        run: node scripts/app-token.mjs

      - name: Re-fetch and verify releases
        env:
          GITHUB_TOKEN: ${{ steps.bot.outputs.token }}
          SYNC_APP_ID: ${{ secrets.SYNC_APP_ID }}
          SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          REPOSITORY_ID: ${{ github.event.client_payload.repository_id || github.event.inputs.repository_id }}
          TAG: ${{ github.event.client_payload.tag || github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${REPOSITORY_ID}" ]; then
            args=(--repository-id "${REPOSITORY_ID}")
            if [ -n "${TAG}" ]; then
              args+=(--tag "${TAG}")
            fi
            node scripts/sync-release.mjs "${args[@]}" | tee sync-summary.json
          else
            node scripts/sync-release.mjs --all | tee sync-summary.json
          fi

      - name: Open a Bot pull request
        env:
          GITHUB_TOKEN: ${{ steps.bot.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: node scripts/open-records-pr.mjs --base main --summary sync-summary.json
